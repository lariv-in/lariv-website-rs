[package]
name = "website-plugin-llm-assistant"
version = "0.1.0"
edition.workspace = true
description = "Assistant preferences, sidebar link, and company app access for this deployment"

[dependencies]
lariv-core = { workspace = true }
website-plugin-rls = { path = "../rls" }
# Same `cap-llm` requirement as the accounting sidebar: companies templates
# call `block_on_async`, which is only compiled in with that feature.
lariv-plugin-bank-accounts = { workspace = true }
lariv-plugin-companies = { workspace = true, features = ["cap-llm"] }
lariv-plugin-contacts = { workspace = true }
lariv-plugin-crm = { workspace = true }
lariv-plugin-customer = { workspace = true }
lariv-plugin-filesystem = { workspace = true }
lariv-plugin-finance-accounts = { workspace = true }
lariv-plugin-finance-creditnotes = { workspace = true }
lariv-plugin-finance-customers = { workspace = true }
lariv-plugin-finance-gst-export = { workspace = true }
lariv-plugin-finance-invoices = { workspace = true }
lariv-plugin-finance-payments = { workspace = true }
lariv-plugin-finance-products = { workspace = true }
lariv-plugin-finance-purchases = { workspace = true }
lariv-plugin-finance-taxes = { workspace = true }
lariv-plugin-import-export = { workspace = true }
lariv-plugin-llm-assistant = { workspace = true }
lariv-plugin-users = { workspace = true }
async-trait = "0.1"
frunk = { workspace = true }
frunk_core = { workspace = true }
futures-util = "0.3"
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
