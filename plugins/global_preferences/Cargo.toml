[package]
name = "website-plugin-global-preferences"
version = "0.1.0"
edition.workspace = true
description = "Site-wide Gemini and Google Search API keys used when a user has not set their own"

[dependencies]
lariv-core = { workspace = true }
lariv-plugin-llm-assistant = { workspace = true }
lariv-plugin-users = { workspace = true }
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
frunk = { workspace = true }
frunk_core = { workspace = true }
maud = "0.27"
serde = { version = "1", features = ["derive"] }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
